env_name: "dev"
app_user: "{{ lookup('env', 'USER') }}"
app_dir: "{{ lookup('env', 'HOME') }}/Documents/Projets/eXamc"
compose_file: "compose.dev.yml"

# Your own user and repo-local folders (instead of the servers' examc user, /etc, /srv)
app_uid: 1000
secrets_dir: "{{ app_dir }}/compose/secrets"
media_dir: "{{ app_dir }}/compose/data/private_media"

# Caddy on https://localhost:8443 with its internal certificate
site_hosts:
  - "localhost"
caddy_port: 8443
caddy_tls_mode: "internal"

debug: true
celery_task_always_eager: true
