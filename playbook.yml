- hosts: app
  # dev runs as you: files owned by you, docker login stored for you
  become: "{{ env != 'dev' }}"

  # Same in every environment. Paths that differ per environment are in inventory/<env>/group_vars/all/app.yml
  vars:
    repo_url: "https://github.com/EPFL-CePro/eXamc.git"
    env_path: "{{ app_dir }}/.env.{{ env }}"

  pre_tasks:
    - name: Stop if the environment's variables weren't loaded
      ansible.builtin.assert:
        that:
          - env is defined
          - app_dir is defined
          - media_dir is defined
          - secrets_dir is defined
        fail_msg: "Variables not loaded: check inventory/<env>/group_vars/all/app.yml."
        quiet: true

  tasks:
    - name: App user and private_media
      ansible.builtin.import_tasks: tasks/app_user.yml

    - name: Secrets and TLS certificate
      ansible.builtin.import_tasks: tasks/secrets.yml

    - name: Code and .env
      ansible.builtin.import_tasks: tasks/code.yml

    - name: Docker Compose stack
      ansible.builtin.import_tasks: tasks/docker.yml