# Registry login and docker compose up. On failure, prints the output, the service
# status and recent logs line by line, then fails.

- name: Log in to Docker Hardened Images
  ansible.builtin.command:
    cmd: docker login dhi.io --username "{{ vault_dockerhub_username }}" --password-stdin
    stdin: "{{ vault_dockerhub_token }}"
  no_log: true
  changed_when: false

- name: Build the compose commands
  ansible.builtin.set_fact:
    compose_cmd: >-
      docker compose -f {{ app_dir }}/compose/{{ compose_file }} --env-file {{ env_path }}
    compose_up_args: >-
      up -d {{ '--build' if env == 'dev' else '--pull always --quiet-pull' }}
      --force-recreate --remove-orphans --wait --wait-timeout 300

- name: "Compose up: {{ compose_cmd }} {{ compose_up_args }}"
  ansible.builtin.command:
    cmd: "{{ compose_cmd }} {{ compose_up_args }}"
    chdir: "{{ app_dir }}"
  register: compose_up
  failed_when: false # handled below, to print the output line by line
  changed_when: true
  when: not ansible_check_mode

- name: On failure, collect service status and recent logs
  ansible.builtin.command:
    cmd: "{{ item }}"
    chdir: "{{ app_dir }}"
  loop:
    - "{{ compose_cmd }} ps -a --format {% raw %}'{{.Service}}: {{.Status}}'{% endraw %}"
    - "{{ compose_cmd }} logs --tail 30 --no-color"
  register: compose_debug
  changed_when: false
  when: not ansible_check_mode and compose_up.rc != 0

- name: Show what failed
  ansible.builtin.debug:
    msg: >-
      {{ compose_up.stderr_lines
         + ['', '--- service status ---'] + compose_debug.results[0].stdout_lines
         + ['', '--- recent logs ---'] + compose_debug.results[1].stdout_lines }}
  when: not ansible_check_mode and compose_up.rc != 0

- name: Fail the deploy
  ansible.builtin.fail:
    msg: "docker compose up failed (exit {{ compose_up.rc }}), see the output above"
  when: not ansible_check_mode and compose_up.rc != 0