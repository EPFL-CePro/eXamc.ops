# One file per vault_secrets key in SECRETS_DIR, mounted by Compose at /run/secrets/<key>.

# --- Checks on the vault, before anything is written (also in --check) -------------

- name: TLS certificate in the vault parses (public key)
  ansible.builtin.command:
    cmd: openssl x509 -noout -pubkey
    stdin: "{{ vault_secrets.tls_crt }}"
  register: tls_crt_pubkey
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  when: caddy_tls_mode | default('internal') == 'certs'

- name: TLS key in the vault parses (public key)
  ansible.builtin.command:
    cmd: openssl pkey -pubout
    stdin: "{{ vault_secrets.tls_key }}"
  register: tls_key_pubkey
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  no_log: true # the private key is passed on stdin
  when: caddy_tls_mode | default('internal') == 'certs'

- name: TLS key matches the certificate
  ansible.builtin.assert:
    that: tls_crt_pubkey.stdout == tls_key_pubkey.stdout
    fail_msg: "tls_key in the vault does not belong to tls_crt"
    quiet: true
  when: caddy_tls_mode | default('internal') == 'certs'


# --- Files ---------------------------------------------------------------------------

# Only root manages the secrets; containers read the files through their own mounts
- name: Secrets directory (root only)
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    owner: "{{ omit if env == 'dev' else 'root' }}"
    group: "{{ omit if env == 'dev' else 'root' }}"
    mode: "0700"

# Files are 0444 because Redis/MySQL run as another user (65532);
# the 0700 directory keeps other host users out.
- name: Secret files from the vault
  ansible.builtin.copy:
    dest: "{{ secrets_dir }}/{{ item }}"
    content: "{{ vault_secrets[item] }}"
    mode: "0444"
  loop: "{{ vault_secrets.keys() | list }}"
  diff: false # never print file contents, even with --diff

- name: Redis ACL
  ansible.builtin.template:
    src: redis_acl.j2
    dest: "{{ secrets_dir }}/redis_acl"
    mode: "0444"
  diff: false

# Removes secrets that were renamed or deleted from the vault
- name: Find secret files on the host
  ansible.builtin.find:
    paths: "{{ secrets_dir }}"
    file_type: file
    hidden: true
  register: secret_files

- name: Remove secret files no longer in the vault
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ secret_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in (vault_secrets.keys() | list + ['redis_acl'])