# App user and private_media. On servers only: dev uses your own user.

- name: App group (fixed ID, same as GID in the containers)
  ansible.builtin.group:
    name: "{{ app_user }}"
    gid: "{{ app_gid | default(app_uid) }}"
    system: true
  when: env != "dev"

- name: App user (no login)
  ansible.builtin.user:
    name: "{{ app_user }}"
    uid: "{{ app_uid }}"
    group: "{{ app_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  when: env != "dev"

# In dev, the folder belongs to whoever runs the playbook
- name: private_media directory
  ansible.builtin.file:
    path: "{{ media_dir }}"
    state: directory
    owner: "{{ omit if env == 'dev' else app_user }}"
    group: "{{ omit if env == 'dev' else app_user }}"
    mode: "0700"

# Only files that don't already belong to the app user: fast on a large tree, and reports what it changed
- name: private_media contents owned by the app user
  ansible.builtin.command:
    cmd: >-
      find {{ media_dir | quote }}
      ( ! -user {{ app_user }} -o ! -group {{ app_user }} )
      -print -exec chown {{ app_user }}:{{ app_user }} {} +
  register: media_chown
  changed_when: media_chown.stdout | length > 0
  when: env != "dev"